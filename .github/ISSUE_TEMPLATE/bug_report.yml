name: Bug report
description: Report a reproducible problem in this repository.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "This is a public issue. Do not paste passwords, tokens, API keys, recovery codes, or other private credentials."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem clearly.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, runtime/browser version, and other non-sensitive environment details.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional screenshots, logs, or notes with sensitive data removed.
