name: Repository Health

on:
  push:
    branches:
      - main
      - publisher-tech-site
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-and-site-health:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit mypy bandit

      - name: Compile Python
        run: python -m compileall -q app.py src tests scripts

      - name: Run tests
        run: python -m pytest -q

      - name: Validate publisher site
        run: python scripts/validate_publisher_site.py

      - name: Ruff static analysis
        run: ruff check app.py src tests scripts --output-format=github

      - name: MyPy static typing
        run: mypy app.py src --config-file mypy.ini

      - name: Bandit security scan
        run: bandit -q -r app.py src scripts

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
