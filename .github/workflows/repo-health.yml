name: Repository Health

on:
  push:
    branches:
      - main
      - publisher-tech-site
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-site-health:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project and audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pip-audit

      - name: Compile Python
        run: python -m compileall -q app.py src tests scripts

      - name: Run tests
        run: pytest -q

      - name: Validate publisher site
        run: python scripts/validate_publisher_site.py

      - name: Ruff static analysis
        run: ruff check app.py src tests scripts --output-format=github

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
