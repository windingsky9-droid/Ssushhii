<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
<title id="title">Sushir 3D Studio</title>
<desc id="desc">Animated banner: a tilted orrery with orbiting planets and a zodiac ring beside the line "Make the work impossible to ignore." Cinematic WebGL, Python and API systems, AI and MCP integrations.</desc>
<style>
.d{font-family:'Space Grotesk','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,'SFMono-Regular','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace}
.chip{font-size:12px;letter-spacing:1.6px;fill:#a9b6c5}
.hud{font-size:11px;letter-spacing:2.4px;fill:#8e9db0}
.tw{animation:tw 4.8s ease-in-out infinite}
.t1{animation-duration:6.1s;animation-delay:-1.3s}.t2{animation-duration:3.7s;animation-delay:-2.2s}
.t3{animation-duration:7.4s;animation-delay:-.6s}.t4{animation-duration:5.3s;animation-delay:-3.9s}
.t5{animation-duration:8.2s;animation-delay:-5.1s}
@keyframes tw{0%,100%{opacity:.16}50%{opacity:.95}}
.spin{transform-origin:0 0;animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.scan{animation:scan 7s ease-in-out infinite}
@keyframes scan{0%{transform:translateY(-140px)}100%{transform:translateY(560px)}}
.pulse{transform-origin:985px 292px;animation:pulse 5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.08)}}
.blink{animation:blink 1.6s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
@media (prefers-reduced-motion:reduce){.tw,.spin,.scan,.pulse,.blink{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070b11"/><stop offset=".55" stop-color="#05070b"/><stop offset="1" stop-color="#080d13"/></linearGradient>
<radialGradient id="glowC" cx=".78" cy=".22" r=".5"><stop offset="0" stop-color="#6fe9ff" stop-opacity=".17"/><stop offset="1" stop-color="#6fe9ff" stop-opacity="0"/></radialGradient>
<radialGradient id="glowV" cx=".16" cy=".78" r=".5"><stop offset="0" stop-color="#a891ff" stop-opacity=".14"/><stop offset="1" stop-color="#a891ff" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#6fe9ff" stroke-opacity=".055"/></pattern>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".85" stop-color="#fff" stop-opacity="0"/></linearGradient>
<mask id="gridMask"><rect width="1280" height="560" fill="url(#fade)"/></mask>
<clipPath id="card"><rect width="1280" height="560" rx="28"/></clipPath>
<linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f8fc"/><stop offset=".7" stop-color="#e4f8ff"/><stop offset="1" stop-color="#9eeeff"/></linearGradient>
<radialGradient id="sun"><stop offset="0" stop-color="#fffdf1"/><stop offset=".32" stop-color="#ffe2a6"/><stop offset=".62" stop-color="#ffc979"/><stop offset="1" stop-color="#ff8f6b" stop-opacity="0"/></radialGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#ffc979" stop-opacity=".42"/><stop offset=".45" stop-color="#ff8f6b" stop-opacity=".12"/><stop offset="1" stop-color="#ff8f6b" stop-opacity="0"/></radialGradient>
<linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fe9ff" stop-opacity="0"/><stop offset=".5" stop-color="#6fe9ff" stop-opacity=".09"/><stop offset="1" stop-color="#6fe9ff" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur in="SourceGraphic" stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
