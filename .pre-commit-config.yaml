repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: ruff check app.py src tests scripts
        language: python
        additional_dependencies:
          - ruff==0.16.10
        pass_filenames: false
        stages: [pre-commit]

      - id: publisher-validator
        name: Publisher site validator
        entry: python scripts/validate_publisher_site.py
        language: python
        pass_filenames: false
        stages: [pre-commit]

      - id: mypy
        name: mypy
        entry: mypy app.py src --config-file mypy.ini
        language: python
        additional_dependencies:
          - mypy==2.4.0
        pass_filenames: false
        stages: [pre-push]

      - id: bandit
        name: Bandit
        entry: bandit -q -r app.py src scripts
        language: python
        additional_dependencies:
          - bandit==1.9.4
        pass_filenames: false
        stages: [pre-push]

      - id: pytest
        name: pytest
        entry: python -m pytest -q
        language: python
        additional_dependencies:
          - requests>=2.32,<3
          - python-dotenv>=1.0,<2
          - Flask>=3.1,<4
          - pytest>=9.0.3,<10
        pass_filenames: false
        stages: [pre-push]
