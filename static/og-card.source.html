<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080b10;--text:#f5f7fb;--muted:#949dab;--accent:#b6f36b;--line:rgba(255,255,255,.1)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{width:1200px;height:630px;background:var(--bg);color:var(--text);
       font-family:"DM Sans",system-ui,sans-serif;overflow:hidden;position:relative}
  .glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
  .g1{width:620px;height:620px;right:-140px;top:-190px;background:rgba(182,243,107,.20)}
  .g2{width:520px;height:520px;left:-170px;bottom:-230px;background:rgba(111,233,255,.14)}
  .wrap{position:relative;height:100%;padding:54px 64px;display:flex;flex-direction:column;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:14px}
  .mark{width:46px;height:46px;border-radius:14px;background:var(--accent);color:#0b1206;
        display:grid;place-items:center;font-weight:700;font-size:17px;letter-spacing:.02em}
  .brand span{font-size:23px;font-weight:600;letter-spacing:-.01em}
  .brand .mark{font-size:15px;letter-spacing:0}
  h1{font-family:"Space Grotesk",sans-serif;font-size:66px;line-height:1.0;
     letter-spacing:-.045em;font-weight:700;max-width:14ch}
  h1 em{font-style:normal;color:var(--accent)}
  h1{max-width:13ch}
  .sub{margin-top:18px;font-size:22px;color:var(--muted);max-width:30ch;line-height:1.35}
  .foot{display:flex;align-items:flex-end;justify-content:space-between;gap:28px}
  .chips{display:flex;gap:10px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);border-radius:999px;padding:9px 16px;
        font-size:16px;color:var(--text);background:rgba(255,255,255,.04)}
  .url{font-size:19px;color:var(--accent);font-weight:600;white-space:nowrap}
  .score{position:absolute;right:64px;top:196px;border:1px solid var(--line);border-radius:20px;
         background:rgba(18,23,31,.86);padding:26px 30px;min-width:250px;backdrop-filter:blur(8px)}
  .score .lbl{font-size:13px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
  .score .val{font-family:"Space Grotesk",sans-serif;font-size:66px;font-weight:700;line-height:1;margin-top:10px}
  .score .val small{font-size:24px;color:var(--muted);font-weight:500}
  .meter{height:7px;border-radius:99px;background:rgba(255,255,255,.1);margin-top:16px;overflow:hidden}
  .meter i{display:block;height:100%;width:84%;background:linear-gradient(90deg,#6fe9ff,var(--accent))}
  .score .tag{margin-top:14px;font-size:18px;color:var(--accent);font-weight:600}
  .score .tkr{margin-top:4px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <div class="wrap">
    <div class="brand"><span class="mark">MO</span><span>Market Observatory</span></div>
    <div>
      <h1>Research the <em>setup</em>, not the hype.</h1>
      <p class="sub">A clean factor snapshot for traders, creators, and curious investors.</p>
    </div>
    <div class="foot">
      <div class="chips">
        <span class="chip">20 tickers</span>
        <span class="chip">No signup</span>
        <span class="chip">Runs instantly</span>
      </div>
      <div class="url">market-observatory.upfling.site</div>
    </div>
  </div>
  <div class="score">
    <div class="lbl">Composite profile</div>
    <div class="val">84<small>/100</small></div>
    <div class="meter"><i></i></div>
    <div class="tag">Constructive</div>
    <div class="tkr">SPY · demo snapshot</div>
  </div>
</body>
</html>
